<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Cumpleaños 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Baloo 2', cursive;
            background: #3f5fb3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: transparent;
            box-shadow: none;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .invita {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .titulo-fiesta {
            font-size: 56px;
            color: #fff3d6;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #1e2f6b;
            line-height: 0.9;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .titulo-fiesta .sorpresa {
            font-size: 44px;
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .nombre {
            color: #ffe7b8;
            font-weight: bold;
            font-size: 28px;
        }

        .foto {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #1e2f6b;
            object-fit: cover;
            margin: 20px auto;
            display: block;
        }

        .detalles {
            background: transparent;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .detalles p {
            margin: 10px 0;
            color: #ffffff;
            font-size: 18px;
        }

        .detalles strong {
            color: #ffe7b8;
        }

        .enlace-mapa {
            color: #ffe7b8;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
        }

        .enlace-mapa:hover {
            color: #ffffff;
        }

        .estado {
            padding: 15px;
            border-radius: 40px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .estado.confirmado {
            background: #ffe7b8;
            color: #1e2f6b;
        }

        .estado.pendiente {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 2px solid #ffe7b8;
        }

        button {
            background: #ffe7b8;
            color: #1e2f6b;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }

        .btn-descarga {
            background: #1e2f6b;
            color: #ffe7b8;
            margin-top: 20px;
        }

        .btn-descarga:hover {
            background: #2d4494;
        }

        .error {
            color: #ffe7b8;
            font-size: 24px;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .loading {
            color: #ffffff;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎂</div>
        <h1 id="titulo" class="loading">Cargando...</h1>
        <div id="contenido"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
            document.getElementById("titulo").innerHTML = '❌ Enlace inválido';
            document.getElementById("titulo").className = 'error';
            document.getElementById("contenido").innerHTML = 
                '<p>No se proporcionó un ID de invitación.</p>';
        } else {
            cargarInvitacion();
        }

        async function cargarInvitacion() {
            try {
                const response = await fetch(`/api/invitacion?id=${id}`);
                
                if (!response.ok) {
                    throw new Error('Invitación no encontrada');
                }

                const data = await response.json();
                mostrarInvitacion(data);
            } catch (error) {
                document.getElementById("titulo").innerHTML = '❌ Invitación no válida';
                document.getElementById("titulo").className = 'error';
                document.getElementById("contenido").innerHTML = 
                    '<p>Esta invitación no existe o ha expirado.</p>';
            }
        }

        function mostrarInvitacion(invitado) {
            document.getElementById("titulo").innerHTML = 
                `<h1 class="titulo-fiesta">Fiesta<br><span class="sorpresa">Sorpresa</span></h1>
                <img src="juanma.png" alt="Foto de Juanma" class="foto" onerror="this.style.display='none'">
                <p style="color:#fff; font-size:22px;">
                    ¡<span class="nombre">${invitado.nombre}</span>, estás invitado/a!
                </p>`;
            document.getElementById("titulo").className = '';

            const estadoHtml = invitado.confirmado 
                ? '<div class="estado confirmado">✅ Asistencia confirmada</div>'
                : '<div class="estado pendiente">❓ Aún no has confirmado tu asistencia</div>';

            const botonHtml = invitado.confirmado 
                ? '<button disabled>Ya confirmaste tu asistencia ✓</button>'
                : '<button onclick="confirmarAsistencia()">Confirmar asistencia</button>';

            document.getElementById("contenido").innerHTML = `
                <p style="color:#fff; font-size:20px; margin: 20px 0;">
                    Te invito a la fiesta sorpresa de <strong style="color:#ffe7b8">Juanma</strong>
                </p>
                <div class="detalles">
                    <p>📅 <strong>Sábado 14 de Febrero 2026</strong></p>
                    <p>🕗 <strong>8:30 PM</strong></p>
                    <p>📍 <strong><a href="https://www.google.com/maps/search/?api=1&query=Calle+104+21-50+Bogota+Colombia" target="_blank" class="enlace-mapa">Calle 104 #21-50 apto 302</a></strong><br><span style="font-size:16px">Edificio Milenio</span></p>
                    <p>🍾 <strong>Cover:</strong> traer el trago de tu preferencia<br><span style="font-size:16px">(hay una sorpresa en la noche)</span></p>
                </div>
                ${estadoHtml}
                <button class="btn-descarga" onclick="descargarInvitacion()">📥 Descargar mi invitación</button>
                ${botonHtml}
            `;
        }

        function descargarInvitacion() {
            window.location.href = `/api/invitacion/descargar?id=${id}`;
        }

        async function confirmarAsistencia() {
            const boton = event.target;
            boton.disabled = true;
            boton.innerText = 'Confirmando...';

            try {
                const response = await fetch(`/api/confirmar?id=${id}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    boton.innerText = '¡Confirmado! ✓';
                    document.querySelector('.estado').className = 'estado confirmado';
                    document.querySelector('.estado').innerHTML = '✅ Asistencia confirmada';
                    
                    // Mostrar mensaje de éxito
                    setTimeout(() => {
                        alert('¡Gracias por confirmar! 🎉 Te esperamos el 15 de Febrero.');
                    }, 300);
                } else {
                    throw new Error('Error al confirmar');
                }
            } catch (error) {
                alert('Hubo un error al confirmar. Por favor, intenta de nuevo.');
                boton.disabled = false;
                boton.innerText = 'Confirmar asistencia';
            }
        }
    </script>
</body>
</html>
